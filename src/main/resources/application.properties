spring.application.name=autoloc-api
server.port=9090
# Connexion a la base de donnees (base renommee pour repartir de zero)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db_v2?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO
